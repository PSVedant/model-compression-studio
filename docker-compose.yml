services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
      - ./results:/app/results:ro

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "7860:7860"
    environment:
      - API_BASE=http://backend:8000
    volumes:
      - ./results:/app/results:ro
    depends_on:
      - backend